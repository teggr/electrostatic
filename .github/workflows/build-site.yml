name: Build and Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build CLI
        run: ./mvnw --batch-mode --no-transfer-progress --projects electrostatic-cli --also-make package

      - name: Build site
        run: |
          CLI_JAR=$(find electrostatic-cli/target -maxdepth 1 -type f -name 'electrostatic-cli-*.jar' ! -name 'original-*' -print -quit)
          test -n "$CLI_JAR"
          java -jar "$CLI_JAR" build \
            --input ./electrostatic-run/src/main/resources/site \
            --output ./generated-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./generated-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
