name: Maven CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Check project consistency
        run: jbang jbang/checkProjectConsistency.java

      - name: Test release helper scripts
        run: jbang jbang/syncReleaseDocumentation.java --self-test

      - name: Run tests and end-to-end smoke checks
        run: ./mvnw --no-transfer-progress install
